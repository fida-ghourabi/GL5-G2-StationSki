apiVersion: apps/v1
kind: Deployment
metadata:
  name: stationski
  namespace: station-ski
spec:
  replicas: 1
  selector:
    matchLabels: { app: stationski }
  template:
    metadata:
      labels: { app: stationski }
    spec:
      containers:
        - name: stationski
          image: saharsaidani/gestion-station-skii:latest
          ports:
            - containerPort: 8087
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/skidb?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stationski
  namespace: station-ski
spec:
  type: NodePort
  selector: { app: stationski }
  ports:
    - port: 8087
      targetPort: 8087
      nodePort: 30080