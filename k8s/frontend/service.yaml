apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stationski
  labels:
    app: frontend
spec:
  # With no AWS Load Balancer Controller, EKS' legacy AWS provider provisions
  # a Classic Load Balancer for this Service.
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
