---
# Prépare le cluster EKS puis laisse ArgoCD déployer l'application (GitOps).
#
# Ce playbook s'exécute SUR L'AGENT JENKINS (connection: local) et parle à l'API
# Kubernetes avec le kubeconfig fourni par Jenkins (variable d'environnement KUBECONFIG).
# Il remplace l'ancien bloc "kubectl ..." du Jenkinsfile.
#
# Ansible prépare le terrain (namespace, secret, configmap, ArgoCD, Application).
# Ansible ne déploie PAS le backend/frontend : c'est ArgoCD qui le fait depuis k8s/app.
#
# Variables d'environnement lues (fournies par Jenkins) :
#   KUBECONFIG, RDS_USERNAME, RDS_PASSWORD, RDS_ENDPOINT
# Variables passées avec -e :
#   argo_repo_url, git_revision, backend_image, frontend_image
#
# Lancement manuel :
#   cd ansible
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook bootstrap-eks.yml -e argo_repo_url=https://github.com/... \
#     -e git_revision=feature/xxx -e backend_image=user/stationski-backend:12-abc1234 \
#     -e frontend_image=user/stationski-frontend:12-abc1234
- name: Préparer EKS et brancher ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_dir: "{{ playbook_dir }}/../k8s"
    argocd_install_url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    db_name: skidb
    rds_username: "{{ lookup('ansible.builtin.env', 'RDS_USERNAME') }}"
    rds_password: "{{ lookup('ansible.builtin.env', 'RDS_PASSWORD') }}"
    rds_endpoint: "{{ lookup('ansible.builtin.env', 'RDS_ENDPOINT') }}"

  tasks:
    # ---------- Application : namespace, secret, configmap ----------
    - name: Créer le namespace stationski
      kubernetes.core.k8s:
        state: present
        src: "{{ k8s_dir }}/namespace.yaml"

    - name: Créer le Secret stationski-db (identifiants RDS)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: stationski-db
            namespace: stationski
          type: Opaque
          stringData:
            username: "{{ rds_username }}"
            password: "{{ rds_password }}"
      no_log: true

    - name: Créer le ConfigMap stationski-backend-config (DB_URL)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: stationski-backend-config
            namespace: stationski
          data:
            DB_URL: "jdbc:mysql://{{ rds_endpoint }}:3306/{{ db_name }}?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"

    # ---------- ArgoCD ----------
    - name: Créer le namespace argocd
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: argocd

    - name: Créer un fichier temporaire pour le manifest ArgoCD
      ansible.builtin.tempfile:
        suffix: argocd-install.yaml
      register: argocd_manifest

    - name: Télécharger le manifest d'installation d'ArgoCD
      ansible.builtin.get_url:
        url: "{{ argocd_install_url }}"
        dest: "{{ argocd_manifest.path }}"
        mode: "0600"
        force: true

    # server-side apply obligatoire : les CRD d'ArgoCD sont trop grosses pour un apply classique
    - name: Installer ArgoCD
      kubernetes.core.k8s:
        state: present
        namespace: argocd
        src: "{{ argocd_manifest.path }}"
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    - name: Supprimer le fichier temporaire
      ansible.builtin.file:
        path: "{{ argocd_manifest.path }}"
        state: absent

    - name: Attendre que la CRD Application soit prête
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: applications.argoproj.io
        wait: true
        wait_condition:
          type: Established
          status: "True"
        wait_timeout: 120

    - name: ArgoCD en HTTP simple (server.insecure)
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: ConfigMap
        name: argocd-cmd-params-cm
        namespace: argocd
        definition:
          data:
            server.insecure: "true"

    - name: Exposer l'interface ArgoCD avec un Load Balancer (NLB)
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Service
        name: argocd-server
        namespace: argocd
        definition:
          metadata:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: nlb
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          spec:
            type: LoadBalancer
            ports:
              - name: http
                port: 80
                targetPort: 8080
                nodePort: 30081

    # équivalent de "kubectl rollout restart" : changer une annotation relance les pods
    - name: Redémarrer argocd-server pour prendre en compte server.insecure
      kubernetes.core.k8s:
        state: patched
        api_version: apps/v1
        kind: Deployment
        name: argocd-server
        namespace: argocd
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).isoformat() }}"

    # ---------- Application ArgoCD (GitOps) ----------
    - name: Lire le modèle de l'Application ArgoCD
      ansible.builtin.set_fact:
        argocd_app: >-
          {{ lookup('ansible.builtin.file', k8s_dir ~ '/argocd/application.yaml')
             | replace('REPO_URL_PLACEHOLDER', argo_repo_url)
             | replace('REVISION_PLACEHOLDER', git_revision)
             | replace('BACKEND_IMAGE_PLACEHOLDER', backend_image)
             | replace('FRONTEND_IMAGE_PLACEHOLDER', frontend_image)
             | from_yaml }}

    - name: Créer ou mettre à jour l'Application ArgoCD station-ski
      kubernetes.core.k8s:
        state: present
        definition: "{{ argocd_app }}"

    - name: Forcer ArgoCD à relire le dépôt Git (refresh hard)
      kubernetes.core.k8s:
        state: patched
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: station-ski
        namespace: argocd
        definition:
          metadata:
            annotations:
              argocd.argoproj.io/refresh: hard
