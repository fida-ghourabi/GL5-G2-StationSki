apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-ski
  namespace: station-ski
spec:
  replicas: 1
  selector:
    matchLabels:
      app: station-ski
  template:
    metadata:
      labels:
        app: station-ski
    spec:
      containers:
        - name: station-ski
          image: saharsaidani/gestion-station-skii:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/skidb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8087
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5