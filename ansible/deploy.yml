---
# Déploie StationSki (MySQL + backend + frontend) sur la VM EC2 créée par Terraform.
#
# Lancement manuel :
#   cd ansible
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook deploy.yml -i "IP_DE_LA_VM," --private-key ~/.ssh/stationski_ansible -e image_tag=12-abc1234
- name: Déployer StationSki sur la VM
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Attendre que la VM accepte les connexions SSH
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300

    - name: Collecter les informations système
      ansible.builtin.setup:

  roles:
    - docker
    - stationski
