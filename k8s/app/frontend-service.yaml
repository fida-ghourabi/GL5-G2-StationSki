apiVersion: v1
kind: Service
metadata:
  name: stationski-frontend
  namespace: stationski
  labels:
    app.kubernetes.io/name: stationski-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stationski-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
