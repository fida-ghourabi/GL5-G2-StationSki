global:
  scrape_interval: 15s

# Backend is reachable only through the shared local Docker monitoring network.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: stationski-backend
    metrics_path: /stationSki/actuator/prometheus
    static_configs:
      - targets: ["backend:8087"]
