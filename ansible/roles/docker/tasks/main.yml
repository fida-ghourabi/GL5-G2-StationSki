---
- name: Installer Docker (Amazon Linux / RedHat)
  ansible.builtin.dnf:
    name:
      - docker
      - python3-pip
    state: present
  when: ansible_facts["os_family"] == "RedHat"

- name: Installer Docker (Debian / Ubuntu)
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-pip
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"

- name: Installer le SDK Python Docker (requis par community.docker)
  ansible.builtin.pip:
    name: docker
    executable: pip3
  when: ansible_facts["os_family"] == "RedHat"

- name: Installer le SDK Python Docker (Debian / Ubuntu)
  ansible.builtin.apt:
    name: python3-docker
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Démarrer et activer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autoriser l utilisateur SSH à utiliser Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
