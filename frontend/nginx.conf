server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # L'API (apiBase = /stationSki dans station.config.ts) est redirigee vers le
    # service Kubernetes du backend : meme origine pour le navigateur, pas de CORS.
    location /stationSki/ {
        proxy_pass http://station-ski:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Application Angular (routes gerees cote client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}