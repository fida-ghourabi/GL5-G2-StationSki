apiVersion: v1
kind: Service
metadata:
  name: stationski-backend
  namespace: stationski
  labels:
    app.kubernetes.io/name: stationski-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /stationSki/actuator/prometheus
    prometheus.io/port: "8087"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stationski-backend
  ports:
    - name: http
      port: 8087
      targetPort: http
