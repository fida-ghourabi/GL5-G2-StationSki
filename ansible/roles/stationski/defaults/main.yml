---
dockerhub_namespace: bennasserhajer
image_tag: latest

backend_image: "{{ dockerhub_namespace }}/stationski-backend:{{ image_tag }}"
frontend_image: "{{ dockerhub_namespace }}/stationski-frontend:{{ image_tag }}"

docker_network: stationski-net
db_container: stationski-db
# Le frontend (nginx.conf) appelle le backend sous ce nom : ne pas le changer.
backend_container: stationski-backend
frontend_container: stationski-frontend

db_name: skidb
db_user: ski_app
# Base accessible uniquement depuis le réseau Docker (aucun port publié).
# Pour changer le mot de passe : export STATIONSKI_DB_PASSWORD=... avant ansible-playbook.
db_password: "{{ lookup(\"ansible.builtin.env\", \"STATIONSKI_DB_PASSWORD\") | default(\"ChangeMe-Ski-2026\", true) }}"

frontend_port: 80
