apiVersion: apps/v1
kind: Deployment
metadata:
  name: stationski-frontend
  namespace: stationski
  labels:
    app.kubernetes.io/name: stationski-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stationski-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stationski-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stationski-frontend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stationski-frontend
  namespace: stationski
  labels:
    app.kubernetes.io/name: stationski-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stationski-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
