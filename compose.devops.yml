# Local coursework stack. Images use moving tags; pin tested versions before CI use.
# No restart policy: services start only when requested.
name: stationski-devops

services:
  jenkins:
    build:
      context: ./devops
      dockerfile: Dockerfile.jenkins
    image: stationski-jenkins:local
    environment:
      # Only CI uses this disposable database, never the host skidb.
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_URL: jdbc:mysql://ci-db:3306/station_test?serverTimezone=UTC
      TEST_DB_USERNAME: ci
      TEST_DB_PASSWORD: local_ci_only
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    depends_on:
      ci-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # Local lab only: jobs can control the Docker host through this socket.
    # This Docker Desktop socket is owned by GID 0; recheck on another host.
    group_add:
      - "0"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  ci-db:
    image: mysql:8.0.33
    environment:
      MYSQL_DATABASE: station_test
      MYSQL_USER: ci
      MYSQL_PASSWORD: local_ci_only
      MYSQL_ROOT_PASSWORD: local_ci_root_only
    # Disposable test data; no host port and no persistent application volume.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D station_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_local_only
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_local_only
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

  nexus:
    image: sonatype/nexus3:latest
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - nexus_data:/nexus-data

  prometheus:
    build:
      context: ./devops
      dockerfile: Dockerfile.prometheus
    image: stationski-prometheus:local
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  jenkins_data:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  nexus_data:
  prometheus_data:
  grafana_data:
