apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stationski
  labels:
    app: frontend
  annotations:
    # Health check for the frontend target group created from the Ingress.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
